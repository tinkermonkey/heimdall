<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1280, initial-scale=1" />
  <title>Reference implementations · prototype code per proposed component</title>
  <link rel="stylesheet" href="heimdall/heimdall.css" />
  <style>
    html, body { background: rgb(var(--canvas-bg-2)); }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 40px 32px 90px; }
    .sec-title {
      font-family: var(--font-mono); font-size: 11px; font-weight: 600;
      letter-spacing: 0.10em; text-transform: uppercase; color: rgb(var(--canvas-fg-3));
      margin: 38px 0 14px; display: flex; align-items: center; gap: 10px;
    }
    .sec-title::after { content: ''; flex: 1; height: 1px; background: rgb(var(--canvas-border)); }
    .ref { margin-bottom: 16px; }
    .ref-head { padding: 16px 18px; border-bottom: 1px solid rgb(var(--canvas-border)); }
    .ref-head .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .ref-head .nm { font-family: var(--font-mono); font-size: 17px; font-weight: 600; color: rgb(var(--canvas-fg-1)); letter-spacing: -0.01em; }
    .ref-head .blurb { font-size: 12.5px; color: rgb(var(--canvas-fg-2)); line-height: 1.55; margin-top: 8px; max-width: 80ch; }
    .ref-head .files { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
    .filechip { font-family: var(--font-mono); font-size: 10.5px; padding: 2px 7px; border-radius: var(--radius-sm); background: rgb(var(--canvas-bg-2)); border: 1px solid rgb(var(--canvas-border)); color: rgb(var(--canvas-fg-2)); }
    /* keep / change notes */
    .notes { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-bottom: 1px solid rgb(var(--canvas-border)); }
    .notes > div { padding: 13px 18px; }
    .notes > div + div { border-left: 1px solid rgb(var(--canvas-border)); }
    .note-h { font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.10em; text-transform: uppercase; margin-bottom: 8px; display: inline-flex; align-items: center; gap: 7px; }
    .note-h.keep { color: rgb(var(--status-emerald)); }
    .note-h.change { color: rgb(var(--accent-primary-deep)); }
    .note-b { font-size: 12.5px; color: rgb(var(--canvas-fg-2)); line-height: 1.55; }
    .note-b code, .filechip code { font-family: var(--font-mono); }
    .codewrap { padding: 4px 18px 8px; }
    .code-label { font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgb(var(--canvas-fg-3)); margin: 14px 0 6px; display: flex; align-items: center; gap: 7px; }
    .code-label .tag { color: rgb(var(--accent-primary-deep)); }
    pre.code {
      margin: 0; padding: 14px 16px; border-radius: var(--radius-lg);
      background: rgb(var(--shell-bg-2)); border: 1px solid rgb(var(--shell-border-2));
      color: rgb(var(--shell-fg-1)); font-family: var(--font-mono); font-size: 11.5px; line-height: 1.65;
      overflow-x: auto; white-space: pre; tab-size: 2;
    }
    pre.code.css { color: rgb(var(--shell-fg-2)); }
    .intro-note { font-size: 12.5px; color: rgb(var(--canvas-fg-2)); line-height: 1.6; }
    code.inl { font-family: var(--font-mono); font-size: 0.92em; background: rgb(var(--canvas-bg-2)); border: 1px solid rgb(var(--canvas-border)); border-radius: 3px; padding: 0 4px; color: rgb(var(--canvas-fg-1)); }
  </style>
</head>
<body>
  <div id="app" class="wrap"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="heimdall/primitives.jsx"></script>
  <script type="text/babel" src="heimdall/shell.jsx"></script>
  <script type="text/babel" src="heimdall/data.jsx"></script>
  <script src="specs/ref-data.js"></script>

  <script type="text/babel">
    const GROUPS = [
      { title: 'Foundational primitive', items: ['Avatar'] },
      { title: 'Versioning suite', items: ['LineageRail', 'VersionTimeline', 'DiffViewer'] },
      { title: 'Cards & lists', items: ['ResultCard', 'AssetCard', 'LogStream'] },
      { title: 'Layout canvases', items: ['Calendar', 'KanbanBoard', 'MapCanvas'] },
    ];
    const byName = Object.fromEntries(window.REF_DATA.map(d => [d.name, d]));

    function Note({ kind, body }) {
      return (
        <div>
          <div className={'note-h ' + kind}>
            <Icon name={kind === 'keep' ? 'check' : 'edit'} size={12} />
            {kind === 'keep' ? 'Keep as-is' : 'Change for production'}
          </div>
          <div className="note-b" dangerouslySetInnerHTML={{ __html: body }} />
        </div>
      );
    }

    function Ref({ name }) {
      const d = byName[name];
      const allFiles = [...new Set(d.sources.map(s => s.file.replace(/ \(inline\)$/, '')))];
      return (
        <Panel noPadding className="ref">
          <div className="ref-head">
            <div className="top">
              <div className="nm">{name}</div>
              <div className="files">{allFiles.map(f => <span key={f} className="filechip">{f}</span>)}</div>
            </div>
            <div className="blurb">{d.blurb}</div>
          </div>
          <div className="notes">
            {d.notes.map((n, i) => <Note key={i} kind={n[0]} body={n[1]} />)}
          </div>
          <div className="codewrap">
            {d.sources.map((s, i) => (
              <div key={i}>
                <div className="code-label"><Icon name="component" size={12} className="tag" /> {s.file} <span style={{color:'rgb(var(--canvas-fg-4))'}}>· prototype JSX</span></div>
                <pre className="code">{s.code}</pre>
              </div>
            ))}
            {d.css ? (
              <div>
                <div className="code-label"><Icon name="palette" size={12} className="tag" /> cl-app.css <span style={{color:'rgb(var(--canvas-fg-4))'}}>· prototype styles (port to a sibling .css with real tokens)</span></div>
                <pre className="code css">{d.css}</pre>
              </div>
            ) : (
              <div>
                <div className="code-label"><Icon name="palette" size={12} className="tag" /> styles</div>
                <div className="intro-note" style={{padding:'2px 0 6px'}}>Styled inline in the prototype helpers above — no dedicated CSS. Production should lift these into a sibling <code className="inl">.css</code> keyed to BEM classes.</div>
              </div>
            )}
          </div>
        </Panel>
      );
    }

    function App() {
      return (
        <React.Fragment>
          <PageHeader
            eyebrow="HEIMDALL · PROPOSED COMPONENTS · REFERENCE CODE"
            title="Reference implementations"
            subtitle="The actual prototype code each promotion spec is drawn from — extracted verbatim from the Context Library build. Treat it as a working starting point, not production source: it uses the prototype’s --cl-* hex aliases and inline styles. Each entry flags what to keep and what to change. Pair with ‘Promotion Specs’ for the target API, states, tokens, and acceptance criteria."
          />
          <Panel style={{ marginBottom: 4 }}>
            <div className="intro-note">
              <b>How to read this.</b> For each component: the JSX is the prototype helper(s) lifted straight from <code className="inl">cl/*.jsx</code>; the CSS is the matching block from <code className="inl">cl/cl-app.css</code>. The <span style={{color:'rgb(var(--status-emerald))'}}>keep</span> column is what already matches heimdall; the <span style={{color:'rgb(var(--accent-primary-deep))'}}>change</span> column is the gap to close — chiefly: replace <code className="inl">--cl-*</code> aliases with real tokens, lift inline styles into a sibling <code className="inl">.css</code>, replace hardcoded data with props, and add <code className="inl">forwardRef</code> + keyboard/a11y per the spec.
            </div>
          </Panel>

          {GROUPS.map(g => (
            <React.Fragment key={g.title}>
              <div className="sec-title">{g.title}</div>
              {g.items.map(n => <Ref key={n} name={n} />)}
            </React.Fragment>
          ))}
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
  </script>
</body>
</html>
