<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OTel Trace Viewer · Heimdall</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  /* ---------------------------------------------------------------------------
     TOKEN SHIM — temporary. These 6 alpha/overlay tokens are used by this
     prototype but are not yet present in design-reference/colors_and_type.css
     (they belong to the alpha/overlay families that flow code↔design). Fold
     these into colors_and_type.css during implementation, then delete this block.
     Values are the canonical Heimdall design-system values. See README.md.
     --------------------------------------------------------------------------- */
  :root {
    --accent-primary-bg-alpha-xs:  rgba(251, 191, 36, 0.05);
    --accent-primary-bg-alpha-sm:  rgba(251, 191, 36, 0.10);
    --status-amber-bg-alpha:       rgba(245, 158, 11, 0.08);
    --status-rose-bg-alpha:        rgba(244, 63, 94, 0.08);
    --semantic-env-bg-alpha:       rgba(245, 158, 11, 0.12);
    --semantic-env-border-alpha:   rgba(245, 158, 11, 0.28);
  }

  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: var(--shell-bg); }
  #root { height: 100vh; }
  * { box-sizing: border-box; }
  button { font-family: var(--font-sans); }

  /* ---- shell ---- */
  .hd-shell { display: flex; height: 100vh; background: var(--shell-bg); }
  .hd-sidebar { width: 248px; flex: 0 0 248px; background: var(--shell-bg-2); border-right: 1px solid var(--shell-border);
    display: flex; flex-direction: column; }
  .hd-brand { display: flex; align-items: center; gap: 9px; padding: 16px 16px 14px; }
  .hd-brand-name { color: var(--shell-fg-1); font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
  .hd-ws-chip { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; color: var(--accent-primary);
    border: 1px solid var(--semantic-env-border-alpha); background: var(--semantic-env-bg-alpha); padding: 2px 7px; border-radius: 999px; }
  .hd-nav-group { flex: 1; overflow-y: auto; padding: 4px 10px 10px; }
  .hd-nav-eyebrow { padding: 6px 6px 5px; font-size: 9.5px; color: var(--shell-fg-3); }
  .hd-nav-item { display: flex; align-items: center; gap: 10px; padding: 7px 9px; border-radius: 6px;
    color: var(--shell-fg-2); font-size: 13.5px; font-weight: 500; cursor: pointer; position: relative; }
  .hd-nav-item:hover { background: var(--shell-surface); color: var(--shell-fg-1); }
  .hd-nav-item.active { background: var(--shell-surface); color: var(--shell-fg-1); }
  .hd-nav-item.active::before { content: ''; position: absolute; left: -10px; top: 5px; bottom: 5px; width: 2px;
    background: var(--accent-primary); border-radius: 0 2px 2px 0; }
  .hd-sidebar-foot { display: flex; align-items: center; gap: 8px; padding: 11px 16px; border-top: 1px solid var(--shell-border);
    font-family: var(--font-mono); font-size: 11px; color: var(--shell-fg-3); }

  .hd-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  /* ---- topbar ---- */
  .hd-topbar { height: 50px; flex: 0 0 50px; background: var(--shell-bg-2); border-bottom: 1px solid var(--shell-border);
    display: flex; align-items: center; gap: 14px; padding: 0 14px; }
  .hd-crumb { display: flex; align-items: center; gap: 6px; color: var(--shell-fg-3); font-size: 13px; }
  .hd-crumb .cur { color: var(--shell-fg-1); font-weight: 500; }
  .hd-search { display: flex; align-items: center; gap: 8px; width: 320px; height: 32px; padding: 0 10px;
    background: rgba(0,0,0,0.22); border: 1px solid var(--shell-border-2); border-radius: 6px; color: var(--shell-fg-3); }
  .hd-search input { flex: 1; min-width: 0; border: none; background: transparent; outline: none; color: var(--shell-fg-1);
    font-family: var(--font-mono); font-size: 12px; }
  .hd-search input::placeholder { color: var(--shell-fg-3); }
  .hd-search kbd { border: 1px solid var(--shell-border-2); background: transparent; color: var(--shell-fg-3); }
  .hd-seg { display: flex; border: 1px solid var(--shell-border-2); border-radius: 6px; overflow: hidden; }
  .hd-seg button { border: none; background: transparent; color: var(--shell-fg-2); font-size: 12px; font-weight: 500;
    padding: 5px 11px; cursor: pointer; }
  .hd-seg button.on { background: var(--shell-surface); color: var(--accent-primary); }
  .hd-icon-btn { width: 32px; height: 32px; border: 1px solid transparent; background: transparent; border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--shell-fg-2); }
  .hd-icon-btn:hover { background: var(--shell-surface); color: var(--shell-fg-1); }
  .hd-avatar { width: 30px; height: 30px; border-radius: 6px; background: linear-gradient(135deg, var(--accent-primary), var(--accent-primary-deep));
    color: #1b1206; font-family: var(--font-mono); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }

  /* ---- canvas ---- */
  .hd-canvas-wrap { flex: 1; min-height: 0; background: var(--shell-bg); padding: 0; display: flex; }
  .hd-canvas { flex: 1; min-width: 0; background: var(--canvas-bg); border-top-left-radius: 8px;
    display: flex; flex-direction: column; overflow: hidden; }
  .hd-page-head { display: flex; align-items: flex-start; gap: 16px; padding: 16px 24px 14px; border-bottom: 1px solid var(--canvas-border); flex: 0 0 auto; }

  .hd-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--canvas-fg-1);
    background: var(--canvas-bg); border: 1px solid var(--canvas-border-strong); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  .hd-btn:hover { background: var(--canvas-surface-2); }

  .hd-trace-body { flex: 1; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; }
  .hd-detail { flex: 0 0 auto; width: 0; overflow: hidden; transition: width 180ms ease; }
  .hd-detail.open { width: 360px; border-left: 1px solid var(--canvas-border); }

  /* ---- statusbar ---- */
  .hd-statusbar { height: 28px; flex: 0 0 28px; background: var(--shell-bg-2); border-top: 1px solid var(--shell-border);
    display: flex; align-items: center; gap: 8px; padding: 0 14px; font-family: var(--font-mono); font-size: 11px; color: var(--shell-fg-2); }
  .hd-statusbar .sep { color: var(--shell-fg-4); }

  /* ---- pulse ---- */
  .hd-pulse { position: relative; width: 8px; height: 8px; display: inline-flex; align-items: center; justify-content: center; }
  .hd-pulse-dot { width: 7px; height: 7px; border-radius: 999px; background: var(--status-ok); z-index: 1; }
  .hd-pulse-glow { position: absolute; inset: 0; border-radius: 999px; background: var(--status-ok);
    animation: hdpulse 1.6s ease-out infinite; }
  @keyframes hdpulse { 0% { transform: scale(0.6); opacity: 0.5; } 100% { transform: scale(1.8); opacity: 0; } }

  /* ---- scrollbars ---- */
  .hd-nav-group, .hd-trace-body *::-webkit-scrollbar, ::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-thumb { background: var(--canvas-border-strong); border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
  *::-webkit-scrollbar-track { background: transparent; }
  .hd-sidebar *::-webkit-scrollbar-thumb { background: var(--shell-border-2); border: 2px solid transparent; background-clip: padding-box; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="lib.jsx"></script>
  <script type="text/babel" src="lane.jsx"></script>
  <script type="text/babel" src="detail.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
