  path: motivation.requirement.layout-output-is-deterministic-for-a-given-input
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Layout Output Is Deterministic for a Given Input
  description: "The same nodes and edges produce the same positions on every run:
    no Math.random, no wall-clock stopping, fixed iteration order and tie-breaks
    (graphClustering.ts, organicLayout.ts headers; galaxyLayout.ts drag
    frames)."
  attributes:
    requirementType: non-functional
    priority: high
  source_reference:
    provenance: inferred
    locations:
      - file: src/utils/graphClustering.ts
  metadata:
    created_at: 2026-11-21T17:02:59.075Z
