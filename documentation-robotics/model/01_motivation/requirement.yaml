  layer_id: motivation
  name: Upstream Publishing Workflows Are Inert in a Mirror
  description: "release.yml, deploy-docs.yml and the CI visual-regression shards must run only in tinkermonkey/heimdall: in any other repo a v* tag publishes nothing, a push to main deploys no docs, and the Visual regression check is green with its shards skipped."
