motivation.requirement.server-rendered-output-hydrates-without-mismatch:
  id: 8705277e-edff-4733-9e9c-d03f464fc2ad
  path: motivation.requirement.server-rendered-output-hydrates-without-mismatch
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Server-Rendered Output Hydrates Without Mismatch
  description: "Components must render on a server (Astro, Next, vite build --ssr, Vitest) without touching window during render, and hydrate without text or attribute mismatches: media queries resolve after mount and time-relative text takes a fixed now/today. Shipped in 0.13.0 (CHANGELOG.md)."
