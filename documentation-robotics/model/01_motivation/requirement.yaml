    version: 1
motivation.requirement.dropdown-panels-render-in-a-portal-by-default:
  id: 54393a2f-a63b-4bfd-8a88-d64fb7203c51
  path: motivation.requirement.dropdown-panels-render-in-a-portal-by-default
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Dropdown Panels Render in a Portal by Default
  description: "Decision #328: every .dropdown-panel user (RowMenu,
    FilterDropdown, Select, EntityPicker) renders its panel in a portal
    positioned from the trigger rect, flipping when there is no room and
    repositioning or closing on scroll; portal={false} keeps in-place
    rendering."
  attributes:
    requirementType: functional
    priority: medium
  source_reference:
    provenance: inferred
    locations:
      - file: design-reference/issue-decisions-2026-11.md
  metadata:
    created_at: 2026-11-21T17:02:59.076Z
    updated_at: 2026-11-21T17:02:59.076Z
    version: 1
