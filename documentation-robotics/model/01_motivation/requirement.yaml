motivation.requirement.galaxy-keeps-orbits-even-over-round-systems:
  id: 57528d68-2be9-4992-a185-a676d1245a4e
  path: motivation.requirement.galaxy-keeps-orbits-even-over-round-systems
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Galaxy Keeps Orbits Even Over Round Systems
  description: "Decision #288 (2026-11-09): for parents with many satellites or
    one dominant branch, even orbit slots win over round systems; the trade-off
    is documented next to SLOT_EVENNESS_BAND and the layout-loop gate is
    relaxed."
  attributes:
    requirementType: quality
    priority: medium
  source_reference:
    provenance: inferred
    locations:
