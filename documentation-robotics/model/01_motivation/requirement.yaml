  id: ce116fc3-988d-4d47-93f3-8e00f8e226f6
  path: motivation.requirement.consumers-bundle-only-the-components-they-import
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Consumers Bundle Only the Components They Import
  description: "An application that imports one component must bundle only that component and what it uses: the package is built one module per source file and its JS imports no CSS. Shipped in 0.13.0 (CHANGELOG.md: import { Button } yields 365 B where 0.12 yielded 669 KB)."
  attributes:
    requirementType: non-functional
    priority: high
