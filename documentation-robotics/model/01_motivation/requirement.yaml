  path: motivation.requirement.large-layouts-do-not-block-the-first-paint
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Large Layouts Do Not Block the First Paint
  description: Engine layouts run only after the computing state has painted
    (yieldToPaint), and layered layouts above ASYNC_LAYOUT_MIN_NODES run in
    chunks (layoutLayersAsync), so the canvas and its busy indicator appear
    before heavy work.
  attributes:
    requirementType: quality
    priority: high
  source_reference:
    provenance: inferred
    locations:
      - file: src/utils/yieldToPaint.ts
