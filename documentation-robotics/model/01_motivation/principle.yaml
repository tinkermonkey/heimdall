  name: Deterministic, Reproducible Layout Output
  description: "Inferred from graphClustering.ts's header comment: louvainCluster
    never uses Math.random or wall-clock time, always iterates in a fixed order,
    and breaks every tie deterministically, because the layout loop's scoring
    depends on reproducible layouts across runs of the same input."
