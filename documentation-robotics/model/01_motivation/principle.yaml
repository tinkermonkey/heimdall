motivation.principle.two-surface-shell-and-canvas:
  id: db86a678-2a26-476a-aa90-978565eaf638
  path: motivation.principle.two-surface-shell-and-canvas
  spec_node_id: motivation.principle
  type: principle
  layer_id: motivation
  name: Two-Surface Shell and Canvas
  description: "Every screen is built from two surfaces: an always-dark slate-navy
    shell and a canvas that is white or dark (the dark-canvas class on body).
    Every colour is a design token in src/tokens/tokens.css with an explicit
    dark-canvas override; filter() and invert() are never used."
  attributes:
    category: architecture
  metadata:
    created_at: 2026-11-23T16:44:40.170Z
    updated_at: 2026-11-23T16:44:40.170Z
    version: 1
motivation.principle.ide-density-and-terse-voice:
  id: 66617be3-ccf8-419c-baf0-a87b2055a315
  path: motivation.principle.ide-density-and-terse-voice
  spec_node_id: motivation.principle
  type: principle
  layer_id: motivation
  name: IDE Density and Terse Voice
  description: "Components default to IDE density (14px body, 24px page H1,
    monospace identifiers and eyebrows) and a terse, impersonal voice:
    sentence-case headings, no exclamation marks or emoji, confirmations that
    state the consequence."
  attributes:
    category: development
  metadata:
    created_at: 2026-11-23T16:44:40.170Z
    updated_at: 2026-11-23T16:44:40.170Z
    version: 1
motivation.principle.every-component-color-comes-from-a-token:
  id: 005b60a0-7bfe-4cfc-831b-25de5872c307
  path: motivation.principle.every-component-color-comes-from-a-token
  spec_node_id: motivation.principle
  type: principle
  layer_id: motivation
  name: Every Component Color Comes From a Token
  description: Component CSS and TypeScript take colors only from design tokens
    (rgb(var(--token)) in both); no color literals outside src/tokens/, except
    pure black and white. npm run check:colors enforces it.
  attributes:
    category: architecture
  metadata:
    created_at: 2026-11-24T17:33:21.786Z
    updated_at: 2026-11-24T17:33:21.786Z
    version: 1
