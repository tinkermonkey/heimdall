security.countermeasure.markdown-rendered-without-raw-html:
  id: 9d3bbbf5-532c-4f08-839a-e45353bfd2da
  path: security.countermeasure.markdown-rendered-without-raw-html
  spec_node_id: security.countermeasure
  type: countermeasure
  layer_id: security
  name: Markdown Rendered Without Raw HTML
  description: "ChatMarkdownContent uses react-markdown with remark-gfm only: no
    rehype-raw, so raw HTML is not rendered, and react-markdown's default URL
    transform drops unsafe protocols such as javascript:."
  attributes:
    type: technical
  source_reference:
    provenance: extracted
    locations:
      - file: src/components/ChatMarkdownContent.tsx
        symbol: ReactMarkdown
  metadata:
    created_at: 2026-11-24T19:01:20.529Z
    updated_at: 2026-11-24T19:01:20.529Z
    version: 1
