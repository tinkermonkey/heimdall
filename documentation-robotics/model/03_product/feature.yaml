product.feature.server-side-rendering-support:
  id: 5afc1cc6-57c7-4760-b277-9428897812bd
  path: product.feature.server-side-rendering-support
  spec_node_id: product.feature
  type: feature
  layer_id: product
  name: Server-Side Rendering Support
  description: "Components render on a server and hydrate without mismatches:
    useMediaQuery takes a serverValue and resolves after mount, ShellLayout,
    Topbar and Statusbar leave data-mobile off until the client knows the
    viewport, and timelines and calendars take a fixed now/today (0.13.0)."
  attributes:
    priority: high
    status: delivered
  metadata:
    created_at: 2026-11-23T16:44:40.171Z
    updated_at: 2026-11-23T16:44:40.171Z
    version: 1
