product.feature.joint-edge-label-placement:
  id: ae250f5d-c198-4e3e-8a68-15676d9d2e9a
  path: product.feature.joint-edge-label-placement
  spec_node_id: product.feature
  type: feature
  layer_id: product
  name: Joint Edge-Label Placement
  description: "GraphCanvas places every edge label at once so labels do not print
    over each other or the cards; a label with no clear spot is hidden until its
    edge or an endpoint is in focus, and renderEdge receives
    EdgeGeometry.labelHidden (PR #396, Unreleased in CHANGELOG.md)."
  attributes:
    priority: high
    status: delivered
  metadata:
    created_at: 2026-11-23T16:44:40.171Z
    updated_at: 2026-11-23T16:44:40.171Z
    version: 1
