  name: Web Browser
  description: "The consumer's browser, which runs every Heimdall component: DOM
    and SVG rendering, ResizeObserver for node measurement,
    requestAnimationFrame for live simulation and tweens, matchMedia for
    useMediaQuery. Heimdall itself has no server; it runs inside the host app's
    page. softwareType is middleware for want of a browser or runtime value in
    the enum."
