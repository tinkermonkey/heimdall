  spec_node_id: technology.technologyfunction
  type: technologyfunction
  layer_id: technology
  name: Library Bundling and Type Declaration Generation
  description: Vite library-mode build (Rollup with preserveModules and
    preserveModulesRoot src, so every source file is its own module and bundlers
    tree-shake per component) plus vite-plugin-dts for type declarations; the JS
    imports no CSS and the stylesheets are emitted separately (0.13.0).
  source_reference:
    provenance: extracted
    locations:
      - file: vite.config.mjs
        symbol: build.lib
  metadata:
