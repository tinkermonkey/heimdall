technology.technologyfunction.library-bundling-and-type-declaration-generation:
  id: e126d913-5d38-45b8-bbfe-14e04048f4cf
  path: technology.technologyfunction.library-bundling-and-type-declaration-generation
  spec_node_id: technology.technologyfunction
  type: technologyfunction
  layer_id: technology
  name: Library Bundling and Type Declaration Generation
  description: "Vite library-mode build (rollup) with preserveModules: one ESM
    file per source module under dist/ (CJS dropped, #343), declarations for the
    public API from vite-plugin-dts, peer and runtime dependencies left
    external. CSS is split by the heimdall-css-sheets plugin (see Stylesheet
    Splitting and Ordering). Was: a single dist/index.js bundle."
  source_reference:
    provenance: extracted
    locations:
      - file: vite.config.mjs
        symbol: build.lib
  metadata:
    created_at: 2026-09-18T14:33:15.835Z
    updated_at: 2026-09-18T14:33:15.835Z
    version: 1
