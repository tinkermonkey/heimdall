  name: Stylesheet Load-Order Check
  description: "npm run check:sheets (scripts/check-sheet-order.mjs): renders each
    dev-app test page with dist/style.css swapped in and checks that opt-in
    component sheets do not depend on load order. Run by hand; no workflow runs
    it."
