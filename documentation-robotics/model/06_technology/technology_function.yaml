technology.technologyfunction.stylesheet-splitting-and-ordering:
  id: d113a291-d232-4741-bbb7-f8d5c3b267a4
  path: technology.technologyfunction.stylesheet-splitting-and-ordering
  spec_node_id: technology.technologyfunction
  type: technologyfunction
  layer_id: technology
  name: Stylesheet Splitting and Ordering
  description: "The heimdall-css-sheets Vite plugin: reads where each module's CSS
    sat in ESM evaluation order, removes the empty-css placeholders, and writes
    style.css, css/base.css and one css/<Name>.css per component in that order,
    failing the build when a sheet is unreachable or out of order."
  source_reference:
    provenance: extracted
    locations:
      - file: vite.config.mjs
        symbol: cssSheets
  metadata:
    created_at: 2026-11-21T18:06:32.237Z
    updated_at: 2026-11-21T18:06:32.237Z
    version: 1
technology.technologyfunction.published-package-verification:
  id: 6727e252-1a21-4259-91f9-bad90ab7d26d
  path: technology.technologyfunction.published-package-verification
  spec_node_id: technology.technologyfunction
  type: technologyfunction
  layer_id: technology
  name: Published Package Verification
  description: "npm run check:package (scripts/check-package-exports.mjs), run in
    CI and before publishing: every exports/main/types path is in the npm pack
    file list, the tarball holds only dist/ and agent-skills/, declarations
    import no unpublished source, dependencies stay external, and no JS module
    imports CSS."
  source_reference:
    provenance: extracted
    locations:
      - file: scripts/check-package-exports.mjs
  metadata:
    created_at: 2026-11-21T18:06:32.237Z
    updated_at: 2026-11-21T18:06:32.237Z
    version: 1
