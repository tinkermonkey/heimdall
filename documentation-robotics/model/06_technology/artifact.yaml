technology.artifact.design-token-stylesheet:
  id: f50c2bbc-e90f-4805-b972-898850e18c47
  path: technology.artifact.design-token-stylesheet
  spec_node_id: technology.artifact
  type: artifact
  layer_id: technology
  name: Design Token Stylesheet
  description: "src/tokens/tokens.css: every design token as a CSS custom
    property. This change derives the accent-alpha tokens and --focus-ring from
    --accent-primary, and adds --chart-series-1..6,
    --chart-light-*/--chart-dark-* (fg-1..4, grid, border, card, inset; both on
    :root), --trace-service-1..10, --accent-primary-ink and --shadow-tint, each
    set to the literal it replaces."
  attributes:
    artifactType: file
  source_reference:
    provenance: manual
    locations:
      - file: src/tokens/tokens.css
  metadata:
    created_at: 2026-11-24T17:33:21.792Z
    updated_at: 2026-11-24T17:33:21.792Z
    version: 1
technology.artifact.theme-stylesheet:
  id: c06f3dbb-7022-4f5a-ac1b-ac813ceb1abd
  path: technology.artifact.theme-stylesheet
  spec_node_id: technology.artifact
  type: artifact
  layer_id: technology
  name: Theme Stylesheet
  description: "src/tokens/theme.css: an override layer that is empty upstream
    (header comment with an example and the caveat that derived tokens resolve
    on :root, so a theme that changes --accent-primary only under
    body.dark-canvas must redeclare them there). Loaded after tokens.css from
    src/index.ts, src/index.css and vite.config.mjs BASE_SHEETS (last), so it
    ships after the tokens in dist/style.css and dist/css/base.css."
  attributes:
    artifactType: file
  source_reference:
    provenance: manual
    locations:
      - file: src/tokens/theme.css
  metadata:
    created_at: 2026-11-24T17:33:21.794Z
    updated_at: 2026-11-24T17:33:21.794Z
    version: 1
