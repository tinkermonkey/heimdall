  spec_node_id: ux.statepattern
  type: statepattern
  layer_id: ux
  name: Canvas Theme (Light or Dark Canvas)
  description: Light canvas by default; the consumer adds dark-canvas to body and
    every --canvas-* token switches to its explicit dark value (no filter or
    invert). The shell surface stays dark in both.
