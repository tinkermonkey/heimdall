  spec_node_id: ux.statepattern
  type: statepattern
  layer_id: ux
  name: Live Simulation vs. Static Layout State
  description: liveSimulation (galaxy layout only) switches GraphCanvas between a
    one-shot computed-then-frozen layout and a continuous, draggable elastic
    simulation.
  attributes:
    category: data-loading
  source_reference:
    provenance: extracted
    locations:
