  spec_node_id: ux.statepattern
  type: statepattern
  layer_id: ux
  name: Collapsed Node Set (Progressive Disclosure)
  description: collapsedNodeIds (controlled by the caller) hides a collapsed
    node's structural descendants and any edge touching one, while the collapsed
    node itself keeps rendering.
  attributes:
    category: data-loading
  source_reference:
