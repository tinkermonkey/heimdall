ux.statepattern.layout-computation-state:
  id: 8ffc64ac-3c3f-4a09-ae53-d9ed3b9218d2
  path: ux.statepattern.layout-computation-state
  spec_node_id: ux.statepattern
  type: statepattern
  layer_id: ux
  name: Layout Computation State
  description: "idle -> computing -> idle (or simulating for live galaxy):
    GraphCanvas renders computing first, yields a frame (yieldToPaint), then
    runs the engine, so the indicator paints before the main thread blocks."
  source_reference:
    provenance: extracted
    locations:
      - file: src/components/GraphCanvas.tsx
        symbol: GraphLayoutState
