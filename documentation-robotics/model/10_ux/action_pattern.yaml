ux.actionpattern.node-drag-reposition:
  id: abb36b11-680a-4a89-9038-31f8d5400f98
  path: ux.actionpattern.node-drag-reposition
  spec_node_id: ux.actionpattern
  type: actionpattern
  layer_id: ux
  name: Node Drag Reposition
  description: Dragging a node past DRAG_THRESHOLD pixels repositions it,
    persisting locally until the node list changes; onNodeDragEnd lets the
    caller persist it elsewhere.
  attributes:
    category: crud
    trigger: click
    feedback: none
  source_reference:
    provenance: extracted
    locations:
      - file: src/components/GraphCanvas.tsx
        symbol: onNodeDragEnd
  metadata:
    created_at: 2026-09-18T14:39:47.472Z
    updated_at: 2026-09-18T14:39:47.472Z
    version: 1
