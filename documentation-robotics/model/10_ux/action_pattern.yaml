  name: Collapse/Expand Toggle (Shift+Enter or Chevron Click)
  description: Shift+Enter on a focused hierarchical node, or clicking its chevron
    button, toggles collapsed state via onToggleCollapse — progressive
    disclosure for dense hierarchies.
  attributes:
    category: crud
    trigger: keyboard
    feedback: animation
  source_reference:
