ux.librarycomponent.pane-rail:
  id: c24aeb60-0dfb-4896-858c-74b8afc887aa
  path: ux.librarycomponent.pane-rail
  spec_node_id: ux.librarycomponent
  type: librarycomponent
  layer_id: ux
  name: PaneRail
  description: "A folded pane shown as a 40px vertical rail: an expand button (aria-expanded false, aria-keyshortcuts when a key is given), a map of the pane's items as toned marks at 0..1 positions (buttons with accessible names, one tab stop with arrow-key roving), an amber notch at the selection's position, an optional position label, the pane's name written up the rail and its key hint. Clicking the button or the rail's empty area calls onExpand; a mark calls onMarkClick, and hover/focus call onMarkHover/onMarkLeave with the mark's anchor element so the app can show its own hover card. Holds no folding state: the app decides when to show it."
  attributes:
    type: layout
    category: heimdall-layout
    label: PaneRail
  source_reference:
