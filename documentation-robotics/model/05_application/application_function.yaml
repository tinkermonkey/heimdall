application.applicationfunction.clustered-force-layout-algorithm:
  id: 34cb4fde-5404-4ffc-bbb6-668b7d78e8af
  path: application.applicationfunction.clustered-force-layout-algorithm
  spec_node_id: application.applicationfunction
  type: applicationfunction
  layer_id: application
  name: Clustered Force Layout Algorithm
  description: "clusteredForceLayout(): opt-in nested-bubble layout — Louvain
    clustering + circle packing + a macro force pass over cluster pseudo-nodes +
    a micro force pass over real nodes gravity-biased toward their cluster
    centroid."
  source_reference:
    provenance: extracted
    locations:
      - file: src/utils/graphLayout.ts
        symbol: clusteredForceLayout
  metadata:
    created_at: 2026-09-18T14:34:59.388Z
