  spec_node_id: application.applicationfunction
  type: applicationfunction
  layer_id: application
  name: Galaxy Radial Orbit Layout Algorithm
  description: "galaxyLayout(): positions nodes as a radial hierarchy of orbits
    from structural edges, settled over repeated galaxySimulationStep cycles,
    then group-separated so independent root subtrees don't overlap."
  source_reference:
    provenance: extracted
    locations:
