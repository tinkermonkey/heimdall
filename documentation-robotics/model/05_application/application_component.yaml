  path: application.applicationcomponent.heimdall-ui-library-module
  spec_node_id: application.applicationcomponent
  type: applicationcomponent
  layer_id: application
  name: Heimdall UI Library Module
  description: "The package's public module (src/index.ts barrel over one module per source file) taken as the owner of the shared, component-independent behaviour its hooks and utilities perform: placement, focus and scroll management, controllable state, SSR-safe media queries, fixed-clock dates, link-click handling, virtualization and trace adapters."
  attributes:
    type: service-component
  source_reference:
    provenance: manual
    locations:
      - file: src/index.ts
  accepted_gaps:
    - direction: outgoing
      predicate: uses
      other_spec_node_id: application.applicationcomponent
      reason: The package uses no other application component. Its runtime dependencies (d3, react-markdown, remark-gfm, React as a peer) are technology artifacts. Its two peers use it, not the other way round.
      decided_by: maintainer
      decided_at: 2026-11-25T10:42:44.225Z
      changeset: changeset-1795603318372-1h53bc45b
  metadata:
    created_at: 2026-11-23T16:47:22.576Z
    updated_at: 2026-11-23T16:47:22.576Z
    version: 1
