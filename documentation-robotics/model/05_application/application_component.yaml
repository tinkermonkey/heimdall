application.applicationcomponent.graph-canvas-component:
  id: 46abcf82-6aff-49ca-85f2-d42625ca97b6
  path: application.applicationcomponent.graph-canvas-component
  spec_node_id: application.applicationcomponent
  type: applicationcomponent
  layer_id: application
  name: GraphCanvas Component
  description: "The primary orchestrating React component: measures nodes,
    dispatches to the layout selected by its layout prop (manual, force,
    organic, orthogonal, galaxy, force-clustered, ux-navigation, radial-tree,
    layer-lanes), owns pan/zoom, selection, hover, collapse and viewport
    history, places edge labels jointly (hiding labels with no room until
    focus), and renders nodes, edges, toolbar, tooltips and popovers."
  attributes:
    type: service-component
  source_reference:
    provenance: extracted
    locations:
      - file: src/components/GraphCanvas.tsx
        symbol: GraphCanvas
  metadata:
    created_at: 2026-09-18T14:34:35.709Z
    updated_at: 2026-09-18T14:34:35.709Z
    version: 1
