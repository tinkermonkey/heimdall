application.applicationevent.node-hover-change-event:
  id: b031e6d1-85ce-4b19-85a5-6a9e7166e385
  path: application.applicationevent.node-hover-change-event
  spec_node_id: application.applicationevent
  type: applicationevent
  layer_id: application
  name: Node Hover Change Event
  description: onNodeHover callback fired with a node's id on pointer-enter and
    undefined on pointer-leave, mirrored in GraphCanvasContext.hoveredNodeId;
    drives structural/navigation edge visibility.
  attributes:
    eventType: domain
