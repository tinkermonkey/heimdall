application.applicationservice.graph-layout-engine-service:
  id: efed7bdb-56b4-4705-b7da-a373ee4bec48
  path: application.applicationservice.graph-layout-engine-service
  spec_node_id: application.applicationservice
  type: applicationservice
  layer_id: application
  name: Graph Layout Engine Service
  description: "The layout engines GraphCanvas dispatches to by its layout prop:
    force, organic, orthogonal, galaxy, force-clustered, ux-navigation,
    radial-tree and layer-lanes ('manual' runs none). GraphCanvas first renders
    the computing layout state and yields a frame (yieldToPaint), then runs the
    engine, reporting idle/computing/simulating through onLayoutStateChange.
    Was: five engines dispatched synchronously."
  attributes:
    serviceType: synchronous
  source_reference:
    provenance: extracted
    locations:
      - file: src/components/GraphCanvas.tsx
        symbol: layout
  metadata:
    created_at: 2026-09-18T14:35:21.141Z
    updated_at: 2026-09-18T14:35:21.141Z
    version: 1
application.applicationservice.live-galaxy-simulation-service:
  id: 2cb2c8a6-442a-42ed-baf5-97645e938e58
  path: application.applicationservice.live-galaxy-simulation-service
  spec_node_id: application.applicationservice
  type: applicationservice
  layer_id: application
  name: Live Galaxy Simulation Service
  description: "useGalaxySimulation(): a continuous, self-scheduling
    requestAnimationFrame loop over galaxySimulationStep — the 'live'
    counterpart to galaxyLayout's bounded one-shot settle loop, coalescing input
    changes into at most one commit per frame."
  attributes:
    serviceType: event-driven
  source_reference:
