    name: Background Click Has No Test
    description: No test exercises GraphCanvas's onBackgroundClick callback or its background pointer-up handling (application.applicationfunction.canvas-pointer-handling). The Graph canvas specs click nodes, edges and toolbar controls, never empty canvas. Found 2026-11-24 when S1/S10 recorded it as an accepted gap; it is a real gap, recorded here until a test covers it.
