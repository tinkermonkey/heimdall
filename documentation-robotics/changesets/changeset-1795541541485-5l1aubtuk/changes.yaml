    spec_node_id: technology.artifact
    type: artifact
    layer_id: technology
    name: Design Token Stylesheet
    description: "src/tokens/tokens.css: every design token as a CSS custom
      property. This change derives the accent-alpha tokens and --focus-ring
      from --accent-primary, and adds --chart-series-1..6,
      --chart-light-*/--chart-dark-* (fg-1..4, grid, border, card, inset; both
      on :root), --trace-service-1..10, --accent-primary-ink and --shadow-tint,
      each set to the literal it replaces."
    attributes:
      artifactType: file
    source_reference:
      provenance: manual
      locations:
