    spec_node_id: technology.technologyprocess
    type: technologyprocess
    layer_id: technology
    name: PR CI Workflow
    description: ".github/workflows/ci.yml: Checks job (tsc, lint, unit tests,
      check:skills, check:colors after it, build + check:package) and the
      sharded Visual regression job. The changes job outputs visual=false when
      github.repository is not tinkermonkey/heimdall, so a mirror's shards skip
      and the summary check stays green."
