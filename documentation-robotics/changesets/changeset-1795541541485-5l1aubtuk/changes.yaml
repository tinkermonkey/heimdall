- type: add
  elementId: motivation.requirement.a-mirror-can-restyle-the-library-from-one-file
  layerName: motivation
  after:
    id: 265aa169-c6e3-4f53-8bd5-dc3899211978
    path: motivation.requirement.a-mirror-can-restyle-the-library-from-one-file
    spec_node_id: motivation.requirement
    type: requirement
    layer_id: motivation
    name: A Mirror Can Restyle the Library From One File
    description: Every color the library paints must be reachable from one override
      file that upstream never edits (src/tokens/theme.css), so a mirror's
      palette survives each release-tag merge without conflicts. Default
      rendering stays pixel-identical upstream.
    attributes:
      requirementType: functional
      priority: high
    metadata:
      created_at: 2026-11-24T17:33:21.785Z
      updated_at: 2026-11-24T17:33:21.785Z
      version: 1
  timestamp: 2026-11-24T17:33:21.807Z
  sequenceNumber: 1
- type: add
  elementId: motivation.requirement.upstream-publishing-workflows-are-inert-in-a-mirror
  layerName: motivation
  after:
    id: 7c91cc9c-51aa-4b46-88cd-2afda4f9a6c5
    path: motivation.requirement.upstream-publishing-workflows-are-inert-in-a-mirror
    spec_node_id: motivation.requirement
    type: requirement
    layer_id: motivation
    name: Upstream Publishing Workflows Are Inert in a Mirror
    description: "release.yml, deploy-docs.yml and the CI visual-regression shards
      must run only in tinkermonkey/heimdall: in any other repo a v* tag
      publishes nothing, a push to main deploys no docs, and the Visual
      regression check is green with its shards skipped."
    attributes:
      requirementType: functional
      priority: high
    metadata:
      created_at: 2026-11-24T17:33:21.786Z
      updated_at: 2026-11-24T17:33:21.786Z
      version: 1
  timestamp: 2026-11-24T17:33:21.807Z
  sequenceNumber: 2
- type: add
  elementId: motivation.principle.every-component-color-comes-from-a-token
  layerName: motivation
  after:
    id: 005b60a0-7bfe-4cfc-831b-25de5872c307
    path: motivation.principle.every-component-color-comes-from-a-token
    spec_node_id: motivation.principle
    type: principle
    layer_id: motivation
    name: Every Component Color Comes From a Token
    description: Component CSS and TypeScript take colors only from design tokens
      (rgb(var(--token)) in both); no color literals outside src/tokens/, except
      pure black and white. npm run check:colors enforces it.
    attributes:
      category: architecture
    metadata:
      created_at: 2026-11-24T17:33:21.786Z
      updated_at: 2026-11-24T17:33:21.786Z
      version: 1
  timestamp: 2026-11-24T17:33:21.807Z
  sequenceNumber: 3
- type: add
  elementId: product.feature.theme-slot
  layerName: product
  after:
    id: 98ac34d7-f2b9-4c58-976a-74eab4a5f086
    path: product.feature.theme-slot
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Theme Slot
    description: "An empty src/tokens/theme.css loaded after tokens.css in every
      stylesheet entry point (index.ts, index.css, dist/style.css,
      dist/css/base.css); accent-derived tokens (focus ring, accent alpha
      tints); new token families for colors that were hard-coded (chart series
      and tones, trace services, accent ink, shadow tint); TS and CSS color
      literals replaced by token references; check:colors in CI; repo-guarded
      release, docs deploy and visual regression. Issue #402."
    attributes:
      priority: high
      status: delivered
      size: l
    metadata:
      created_at: 2026-11-24T17:33:21.790Z
      updated_at: 2026-11-24T17:33:21.790Z
      version: 1
  timestamp: 2026-11-24T18:12:45.041Z
