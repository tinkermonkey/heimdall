id: changeset-1795541541485-5l1aubtuk
name: theme-slot
description: "Let a mirrored copy of the repo restyle the library from one file:
  an empty src/tokens/theme.css loaded after tokens.css, accent-derived tokens,
  new token families for colors hard-coded in TS/CSS (chart series and tones,
  trace services, accent ink, shadow tint), a check:colors CI check that stops
  new literals, release/docs-deploy/visual-regression workflows limited to
  tinkermonkey/heimdall, and docs. Done = default rendering pixel-identical, all
  checks pass, no snapshot updates. (Issue #402)"
