    type: principle
    layer_id: motivation
    name: Every Component Color Comes From a Token
    description: Component CSS and TypeScript take colors only from design tokens (rgb(var(--token)) in both); no color literals outside src/tokens/, except pure black and white. npm run check:colors enforces it.
    attributes:
      category: architecture
    metadata:
