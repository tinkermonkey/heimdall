- type: add
  elementId: motivation.requirement.a-mirror-can-restyle-the-library-from-one-file
  layerName: motivation
  after:
    id: 6ad81cba-553c-445f-b87b-2a2e9613e926
    path: motivation.requirement.a-mirror-can-restyle-the-library-from-one-file
    spec_node_id: motivation.requirement
    type: requirement
    layer_id: motivation
    name: A Mirror Can Restyle the Library From One File
    description: Every color the library paints must be reachable from one override file that upstream never edits (src/tokens/theme.css), so a mirror's palette survives each release-tag merge without conflicts. Default rendering stays pixel-identical upstream.
    attributes:
      requirementType: functional
      priority: high
    metadata:
      created_at: 2026-11-24T21:49:32.044Z
      updated_at: 2026-11-24T21:49:32.044Z
      version: 1
  timestamp: 2026-11-24T21:49:39.383Z
  sequenceNumber: 1
