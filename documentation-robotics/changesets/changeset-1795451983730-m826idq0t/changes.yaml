    spec_node_id: motivation.requirement
    type: requirement
    layer_id: motivation
    name: Consumers Bundle Only the Components They Import
    description: "An application that imports one component must bundle only that
      component and what it uses: the package is built one module per source
      file and its JS imports no CSS. Shipped in 0.13.0 (CHANGELOG.md: import {
      Button } yields 365 B where 0.12 yielded 669 KB)."
    attributes:
      requirementType: non-functional
      priority: high
    metadata:
      created_at: 2026-11-23T16:44:40.170Z
      updated_at: 2026-11-23T16:44:40.170Z
