    spec_node_id: motivation.goal
    type: goal
    layer_id: motivation
    name: Consistent Component Library for Data-Dense IDE-Style Applications
    description: One React component library, published as
      @tinkermonkey/heimdall-ui, that gives IDE-density applications a
      consistent look (two-surface shell and canvas, amber accent, Inter and
      JetBrains Mono) and behaviour across primitives, inputs, data display,
      charts, overlays, chat, observability and graph views. Stated in CLAUDE.md
      and README.md.
    attributes:
      priority: high
