    path: motivation.requirement.server-rendered-output-hydrates-without-mismatch
    spec_node_id: motivation.requirement
    type: requirement
    layer_id: motivation
    name: Server-Rendered Output Hydrates Without Mismatch
    description: "Components must render on a server (Astro, Next, vite build --ssr,
      Vitest) without touching window during render, and hydrate without text or
      attribute mismatches: media queries resolve after mount and time-relative
      text takes a fixed now/today. Shipped in 0.13.0 (CHANGELOG.md)."
    attributes:
      requirementType: non-functional
      priority: high
    metadata:
      created_at: 2026-11-23T16:44:40.170Z
      updated_at: 2026-11-23T16:44:40.170Z
