id: changeset-1795451983730-m826idq0t
name: heimdall-model-audit-2026-11
description: "Audit of the DR model against origin/main (5d20eb9, package
  0.13.0). Brings the model from its September graph-visualization scope
  (v0.8.0) up to the code as built: fixes stale source references and test
  symbols, removes the api.operation for computeEdgePath (no longer a public
  export), adds the newer graph engines (orthogonalLayout with its lattice and
  channel routers, organicLayout), joint edge-label placement
  (EdgeGeometry.labelHidden), the layered-graph framework and views (LayerStack,
  lanes, AdjacencyMatrix, HivePlot, LayeredGraphExplorer, ReachInspector), the
  0.13.0 work (one module per source file, href links, SSR-safe useMediaQuery,
  fixed now/today props), and the full public component inventory of
  src/index.ts as ux library components with their test coverage. Done when
  every exported component and engine has an element with a source reference,
  stale references are fixed, and the brief shows no unexplained gaps."
