    type: applicationfunction
    layer_id: application
    name: Pane Rail Marks
    description: orderPaneRailMarks() clamps each mark's position to 0..1 and sorts
      the marks by position (stable), so the rail renders them top to bottom in
      reading order; nextPaneRailMarkIndex() maps ArrowUp/ArrowDown/Home/End to
      the next focused mark for the rail's roving tab stop.
