        description: "layoutBranchMap(): validate the input (duplicate ids, dangling references and cycles go to issues, never throw), rank stations (dated done stations above the start marker by date; open stations below it by longest path over station.after, line from-to with a minimum span, and dependency links, solved across all groups so cross-group links point down), choose each trunk, bundle lines, assign rank bands with one sub-row per station per group, assign lanes by interval colouring (trunk on lane 0, freed lanes reused), place the labels, then pack groups left to right by their measured width. Output is BranchMapLayout: positions only."
