id: changeset-1795628359757-v0v6gnap1
name: branch-map-poc
description: 'Proof of concept for the Metro bands branch map (direction decided 2026-11-25, House gate "Branch map direction"; House milestone "Branch map POC"; GitHub milestone tinkermonkey/heimdall milestone 1; PR tinkermonkey/heimdall#415). Promotes the prototype in src/test-pages/branchMap/ into a vocabulary-free heimdall view: a generic input model (groups, stations with kind, status and optional date, lines with from, to, weight and style, links between groups), a pure deterministic layout under src/utils/branchMap/ with placement, label placement and routing as separate stages, a standalone BranchMap view component, and a House adapter that stays in the test pages. Built in four pieces that do not share files: #411 model types, stubs and sample fixture, then in parallel #412 layout and its unit tests, #413 BranchMap view plus src/index.ts exports and the graph agent skill, #414 House adapter, test page, App.tsx route, Playwright spec and baselines, docs showcase and README. Done when: no two stations, labels or groups overlap on the 2026-11-25 House snapshot (unit-tested); every group stays within its lane budget (Documentation Robotics'' 20 streams and Claude Plugins'' 17 fit in 8 lanes, expandable); labels sit beside their stations with no fixed label column and no rotated lane names; the test page ?example=branch-map renders the snapshot through the adapter; tests/branch-map.spec.ts has light and dark baselines; BranchMap is exported, documented in agent-skills/heimdall-graph and passes check:skills and check:colors. Decisions 3 to 6, confirmed by Austin 2026-11-25: (3) width off by default, weight-based width an option; (4) the trunk is the heaviest milestone chain, through stated waypoints (group.trunk); the House adapter gives a project''s interface-delivering milestones as waypoints; (5) bundle lines by fork and destination, then collapse the lightest into one ''N more'' line per group past maxLanes (8), each expandable, as is the whole group; (6) a standalone view component sharing usePanZoom and the controlled-selection convention, not a GraphCanvas layout mode. Verified against the as-built record extract-6190a49..f7429a9 (refreshed at 4f08831): no real departures.'
