id: changeset-1795628359757-v0v6gnap1
name: branch-map-poc
description: 'Proof of concept for the Metro bands branch map (direction decided 2026-11-25, House gate "Branch map direction"; House milestone "Branch map POC"; GitHub milestone tinkermonkey/heimdall milestone 1). Promotes the prototype in src/test-pages/branchMap/ into a vocabulary-free heimdall view: a generic input model (groups, stations with kind, status and optional date, lines with from, to, weight and style, links between groups), a pure deterministic layout under src/utils/branchMap/ with placement, label placement and routing as separate stages, a standalone BranchMap view component, and a House adapter that stays in the test pages. Built in four pieces that do not share files: #411 model types, stubs and sample fixture (first; the others wait for it), then in parallel #412 layout and its unit tests, #413 BranchMap view plus src/index.ts exports and the graph agent skill, #414 House adapter, test page, App.tsx route, Playwright spec and baselines, docs showcase, README, and verifying and landing this changeset. Done when: no two stations, labels or groups overlap on the 2026-11-25 House snapshot (unit-tested); every group stays within its lane budget (Documentation Robotics'' 20 streams and Claude Plugins'' 17 fit in 8 lanes, expandable); labels sit beside their stations with no fixed label column and no rotated lane names; the test page ?example=branch-map renders the snapshot through the adapter; tests/branch-map.spec.ts has light and dark baselines; BranchMap is exported, documented in agent-skills/heimdall-graph and passes check:skills and check:colors. Proposed defaults for the open decisions, pending Austin''s confirmation: (3) width off by default, weight-based width available as an option; (4) a group may state its trunk, otherwise the heaviest milestone chain is derived; (5) bundle lines by destination, then collapse the rest into one ''N more'' line per group past maxLanes (8), expandable per group or bundle; (6) a standalone view component sharing usePanZoom and the controlled-selection convention, not a GraphCanvas layout mode.'
