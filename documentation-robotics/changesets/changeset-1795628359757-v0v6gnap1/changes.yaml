- type: add
  elementId: application.applicationfunction.house-branch-map-adapter
  layerName: application
  after:
    id: 11d91168-d6cb-4614-b857-4e854dfa5410
    path: application.applicationfunction.house-branch-map-adapter
    spec_node_id: application.applicationfunction
    type: applicationfunction
    layer_id: application
    name: House Branch Map Adapter
    description: "houseToBranchMap(snapshot, { projects, horizon, widthBy }) in src/test-pages/branchMap/houseBranchMapAdapter.ts: maps the House organizing snapshot to BranchMapData. Projects become groups (fixed palette colour per project), milestones stops and gates decisions (proposed to planned, open gate to active, reached and decided to done, with reached_on or decided_on as the date), depends_on and opens within a project become station after; workstreams become lines (from: the latest station in its own project that opened it or that it waits on, else the start; style dashed for explorations, dotted for set aside, set aside winning; weight 1 or open plus done tasks; open tasks as marks, in progress emphasized), depends_on across projects dependency links (a workstream's wait lands on its destination), interfaces provides links from the provider's next open delivering milestone (else its start) to each other user's start, blocked derived as House derives it over the whole snapshot. A project's milestones that deliver an active interface become its trunk waypoints in depends_on order (decision 4, 2026-11-25); a project delivering none states none. Visible projects and the horizon (from now, whole history) are the adapter's filter. Stays out of the library."
    metadata:
      created_at: 2026-11-25T17:41:12.936Z
      updated_at: 2026-11-25T17:41:12.936Z
      version: 1
    source_reference:
      provenance: manual
      locations:
