  layerName: application
  after:
    id: 05923b0b-b2d5-4d23-9045-f625886d93e0
    path: application.applicationfunction.branch-map-placement
    spec_node_id: application.applicationfunction
    type: applicationfunction
    layer_id: application
    name: Branch Map Placement
    description: "layoutBranchMap() in src/utils/branchMap/layout.ts: validate the input (duplicate ids, dangling references and cycles go to issues, never throw), rank stations (rank.ts: dated done stations above the start marker by date; open stations below it by longest path over station.after, line from-to with a minimum span, and dependency links, solved across all groups so cross-group links point down), choose each trunk (dated done stations no live line leads to join it), bundle lines, assign rank bands with one sub-row per station per group, assign lanes by interval colouring (lanes.ts: trunk on lane 0, freed lanes reused; lines from the start leave the trunk one row apart as a staggered fan), place the labels, then pack groups left to right by their measured width. Output is BranchMapLayout: positions only."
    metadata:
      created_at: 2026-11-25T17:41:12.936Z
      updated_at: 2026-11-25T17:41:12.936Z
      version: 1
    source_reference:
