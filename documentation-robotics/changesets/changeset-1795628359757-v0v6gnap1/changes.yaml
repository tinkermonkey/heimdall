- type: add
  elementId: application.applicationfunction.branch-map-trunk-selection
  layerName: application
  after:
    id: ad8dade0-8030-4fab-83c1-dbb035b79f9a
    path: application.applicationfunction.branch-map-trunk-selection
    spec_node_id: application.applicationfunction
    type: applicationfunction
    layer_id: application
    name: Branch Map Trunk Selection
    description: "chooseBranchMapTrunk(): the heaviest chain of stops in rank order (weight from arriving lines and their weight, a bonus for consecutive stops linked by after). A stated trunk (group.trunk) names waypoints the chain must pass through; each stretch between waypoints, and before the first and after the last, is chosen on its own. Waypoints of one rank are a tie, not an inversion; ids outside the group or a later rank given before an earlier one are reported as invalid-trunk. Decision stations sit on the trunk when nothing leads to them and their row is free. Decided 2026-11-25 (decision 4): waypoints rather than an exact trunk, so a stated trunk stays a long main line."
    metadata:
      created_at: 2026-11-25T17:41:12.936Z
      updated_at: 2026-11-25T17:41:12.936Z
      version: 1
    source_reference:
      provenance: manual
      locations:
        - file: src/utils/branchMap/trunk.ts
          symbol: chooseBranchMapTrunk
  timestamp: 2026-11-25T23:03:21.478Z
  sequenceNumber: 9
- type: add
  elementId: application.applicationfunction.branch-map-line-bundling
  layerName: application
  after:
    id: 0412909b-c3f8-4759-979e-0379924e3ea1
    path: application.applicationfunction.branch-map-line-bundling
    spec_node_id: application.applicationfunction
    type: applicationfunction
    layer_id: application
    name: Branch Map Line Bundling
    description: "bundleBranchLines() in src/utils/branchMap/bundle.ts: keeps a group within maxLanes. Merges lines that fork from the same place (a station, or the group's start) and deliver to the same station into one bundle line (members, count, summed weight; id bundle:<group>:<from|start>:<to>), largest sets first; if still over budget, collapses the lightest remaining lines and bundles into one 'N more' line per group (more:<group>). Groups and bundles named in expanded are left whole, and an expanded more:<group> draws the lines and bundles it would have held, past the budget. Deterministic tie-breaks by id. As built, the bundle key is the exact fork plus destination, not the fork's rank as first planned."
    metadata:
      created_at: 2026-11-25T17:41:12.936Z
      updated_at: 2026-11-25T17:41:12.936Z
      version: 1
    source_reference:
      provenance: manual
      locations:
        - file: src/utils/branchMap/bundle.ts
          symbol: bundleBranchLines
  timestamp: 2026-11-25T23:03:21.675Z
  sequenceNumber: 10
- type: add
  elementId: application.applicationfunction.branch-map-label-placement
  layerName: application
  after:
    id: 32362735-cf60-4334-96a5-14153be11cfb
    path: application.applicationfunction.branch-map-label-placement
    spec_node_id: application.applicationfunction
    type: applicationfunction
    layer_id: application
    name: Branch Map Label Placement
    description: "placeBranchMapLabels() in src/utils/branchMap/labels.ts: per group, candidate boxes for each station label on its own sub-row (right of the station, right of the lines running past that row, or left of a station off the trunk) and each line label (horizontal, right of the line's run near its fork, sliding down the run when taken), placed greedily by priority (trunk stations, then other stations, then line names) so no box overlaps another box or a station mark; crossing a line and distance from the anchor are soft costs. Text width from options.measureText or a character-width estimate; wraps to two lines at maxLabelWidth, then ellipsis. Returns placed and unplaced labels; layoutBranchMap sets the group's width from the placed boxes."
    metadata:
      created_at: 2026-11-25T17:41:12.936Z
      updated_at: 2026-11-25T17:41:12.936Z
      version: 1
    source_reference:
