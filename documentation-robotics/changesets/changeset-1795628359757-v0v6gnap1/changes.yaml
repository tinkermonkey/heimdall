    path: motivation.requirement.graph-layout-and-edge-routing-are-separate-headless-stages
    spec_node_id: motivation.requirement
    type: requirement
    layer_id: motivation
    name: Graph Layout and Edge Routing Are Separate Headless Stages
    description: "A graph layout mode is a pure, headless function: placement emits positions, and edge or line routing is a separate stage that reads only the placement and emits polylines per edge or line. No DOM, no measurement during layout (text widths come from an injected measure function or a character-width estimate). From the graph layout foundation's hard requirements."
    attributes:
      requirementType: quality
      priority: high
