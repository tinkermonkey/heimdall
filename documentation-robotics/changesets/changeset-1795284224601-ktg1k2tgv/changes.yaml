    spec_node_id: technology.technologyfunction
    type: technologyfunction
    layer_id: technology
    name: Stylesheet Splitting and Ordering
    description: "The heimdall-css-sheets Vite plugin: reads where each module's CSS
      sat in ESM evaluation order, removes the empty-css placeholders, and
      writes style.css, css/base.css and one css/<Name>.css per component in
      that order, failing the build when a sheet is unreachable or out of
      order."
    source_reference:
      provenance: extracted
      locations:
        - file: vite.config.mjs
          symbol: cssSheets
