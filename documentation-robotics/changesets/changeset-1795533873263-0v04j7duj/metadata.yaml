id: changeset-1795533873263-0v04j7duj
name: heimdall-graph-components-s10
description: "Apply ruling S10 to heimdall's 8 Graph React components: each is
  modelled once, as a ux library component. The 8 application components that
  duplicate them are retired. Their tests and coverage move to the ux
  components, their behaviour (function and process assignments, service
  realizations, data reads) moves to the package component, and links the ux
  components already carry (browser, artifact) are dropped. The two ux elements
  that each modelled a pair (GraphEdge/GraphEdgeShape,
  GraphInspector/GraphEdgeInspector) are split into one library component per
  exported component, their links divided by what each file imports. The
  GraphCanvas layout/viewport collaboration, which aggregated only GraphCanvas,
  is retired and its links move to the package. The 7 GraphCanvas events get
  triggers from the code that raises them: new functions for edge pointer
  handling, canvas pointer handling, collapse toggling and programmatic viewport
  moves, the existing pan-zoom gesture interaction (viewport dwell) and the
  existing render pipeline (layout-state change). Coverage links from tests that
  import only the GraphEdge TypeScript interface, not the GraphEdge component,
  are dropped."
