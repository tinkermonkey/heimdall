id: changeset-1795530260776-vzupu4xrv
name: heimdall-ui-public-api
description: "Model @tinkermonkey/heimdall-ui's public API per ruling S1
  (2026-11-21). The package becomes an application component that realizes one
  application service per export module with exported functions or hooks (about
  27), and realizes the UI-family services. The 18 api.operation entries and the
  graph tag that misfile library exports are retired: their coverage, feature
  and requirement links move to the matching service or, for the 8 React
  components, to the ux library component. The four orphaned schema definitions
  get linked to the code that reads them. The application interface for the
  package's `.` entry point waits until the spec allows an in-process protocol
  (Context Studio proposal for ApplicationInterface.protocol). Out of scope: the
  8 Graph application components that duplicate ux library components (S10, a
  follow-up changeset), and the CSS and font subpath exports (technology
  artifacts)."
